slam_toolbox:
  ros__parameters:

    # ── Solver ────────────────────────────────────────────────────────────
    # CeresSolver: most accurate. Don't change.
    solver_plugin:              solver_plugins::CeresSolver

    # SPARSE_NORMAL_CHOLESKY: fast, good for sparse indoor graphs.
    # Switch to DENSE_SCHUR only if accuracy degrades on large maps.
    ceres_linear_solver:        SPARSE_NORMAL_CHOLESKY

    # SCHUR_JACOBI: stable default preconditioner. Leave it.
    ceres_preconditioner:       SCHUR_JACOBI

    # LEVENBERG_MARQUARDT: most robust to poor initial guesses.
    ceres_trust_strategy:       LEVENBERG_MARQUARDT
    ceres_dogleg_type:          TRADITIONAL_DOGLEG

    # CauchyLoss: soft-rejects outlier matches. Reduces sudden jumps
    # from bad loop closures. ↑ robustness → ↓ jitter, ↓ max accuracy.
    # None → accepts all matches equally, more aggressive corrections.
    ceres_loss_function:        CauchyLoss

    # ── ROS frames ────────────────────────────────────────────────────────
    odom_frame:                 odom
    map_frame:                  map
    base_frame:                 base_footprint
    scan_topic:                 /scan_filtered
    mode:                       mapping

    # ── Logging ───────────────────────────────────────────────────────────
    # ↑ true → verbose match scores printed each scan, useful to diagnose
    # why corrections are being accepted or rejected.
    # Keep false in production — I/O overhead affects timing on Pi.
    debug_logging:              false

    # ── Scan ingestion ────────────────────────────────────────────────────
    # Process every Nth scan from /scan_filtered.
    # ↑ → fewer scans processed → ↓ CPU, ↓ queue pressure, ↓ jitter.
    # ↓ → more corrections per second → ↑ responsiveness, ↑ CPU load.
    # At A1M8 10 Hz: throttle=3 → ~3.3 Hz effective processing rate.
    # PRIMARY FIX for the "queue is full" log warning.
    throttle_scans:             3

    # TF rebroadcast period (seconds) for map→odom.
    # ↓ → smoother pose updates in RViz, more network traffic.
    # ↑ → choppier visual, less WiFi load. 0.1 s = 10 Hz is fine.
    transform_publish_period:   0.1

    # Occupancy grid rebuild interval (seconds) — RViz display only.
    # Has zero effect on SLAM accuracy or pose estimation.
    # ↑ → less bandwidth to RViz, no mapping downside.
    map_update_interval:        0.5

    # Map cell size in metres.
    # ↓ → finer map, more RAM, more CPU, no benefit below ~0.03 m for A1M8.
    # ↑ → coarser map, faster, less accurate obstacle boundaries.
    resolution:                 0.05

    # Discard lidar rays beyond this distance (metres) before matching.
    # ↑ → more map range, noisier far returns degrade match quality.
    # A1M8 reliable to ~6 m indoors; 5.0 m is conservative and cleaner.
    max_laser_range:            5.0

    # Hard time gate: minimum seconds between two processed scans.
    # Works alongside throttle_scans — both gates must pass.
    # ↑ → fewer corrections per second, ↓ jitter, ↓ CPU.
    # ↓ → more responsive to fast motion, ↑ CPU, ↑ queue pressure.
    minimum_time_interval:      0.4

    # Seconds to wait for a TF lookup before dropping the scan.
    # ↑ → tolerates more WiFi jitter between Pi (EKF) and PC (SLAM).
    # Too high → stale TF gets used, introducing drift.
    # SECONDARY FIX for the "queue is full" warning.
    transform_timeout:          1.0

    # Seconds of TF history retained in the buffer.
    # ↑ → survives longer WiFi dropouts without scan drops.
    # Memory cost is negligible.
    tf_buffer_duration:         90.0

    # ── Graph node insertion ───────────────────────────────────────────────
    # A new pose graph node is committed only when BOTH travel thresholds
    # below are exceeded. Scan matching still runs on every ingested scan
    # for pose tracking, but the graph only grows when you've moved enough.

    # Scan-to-map matching master switch.
    # false → pure odometry, no lidar corrections at all.
    use_scan_matching:          true

    # Use scan point centroid as match reference point.
    # true → stabler matches, almost always better. Leave it.
    use_scan_barycenter:        true

    # Metres of translation required before inserting a new graph node.
    # ↑ → fewer nodes → fewer correction events → ↓ jitter.
    # Too high → gaps between nodes degrade loop closure detection.
    # 0.5 m is strict; reduce to 0.3 m if loop closures start missing.
    minimum_travel_distance:    0.5

    # Radians of rotation required before inserting a new graph node.
    # ↑ → same effect as above for heading changes.
    # 0.4 rad ≈ 23° — robot must turn noticeably before new node added.
    minimum_travel_heading:     0.4

    # ── Scan buffer (local context window) ────────────────────────────────
    # Number of recent scans held for local scan-to-scan matching.
    # ↑ → richer local context, more RAM, slower per-scan processing.
    scan_buffer_size:           20

    # Drop scans from buffer if their origin is beyond this distance (m).
    # ↑ → larger local context, helps in large open spaces.
    scan_buffer_maximum_scan_distance: 10.0

    # ── Local link matching ───────────────────────────────────────────────
    # Minimum fine-match score (0.0–1.0) to accept a local graph edge.
    # ↑ → only high-confidence matches create edges → ↓ jitter.
    # Too high → robot loses tracking in geometrically sparse areas.
    # MOST IMPACTFUL single knob for local correction jitter.
    # Start at 0.5; raise to 0.6 if jitter persists, lower to 0.4 if
    # tracking is lost frequently.
    link_match_minimum_response_fine:  0.6

    # Max distance (metres) to search for a prior scan to link against.
    # Should be ≥ minimum_travel_distance. ↑ → more link candidates, slower.
    link_scan_maximum_distance:        1.5

    # ── Loop closure ──────────────────────────────────────────────────────
    # Search radius (metres) for loop closure candidate nodes.
    # ↑ → finds closures across larger environments, more CPU per scan.
    loop_search_maximum_distance:      3.0

    # Master switch for loop closure.
    # false → no global pose graph corrections. Map drifts over time but
    # zero sudden jumps. Toggle off temporarily to isolate jitter source.
    do_loop_closing:            true

    # Minimum consecutive agreeing nodes before attempting loop closure.
    # ↑ → harder to trigger, fewer false closures, ↓ jitter from jumps.
    # Too high → misses real loops in small or revisited spaces.
    # 25 is strict; lower to 15 if real loops are being missed.
    loop_match_minimum_chain_size:     25

    # Maximum covariance allowed to pass the coarse closure stage.
    # ↑ → more candidates advance to fine matching → more CPU, more risk.
    # ↓ → only geometrically tight candidates proceed → faster, stricter.
    loop_match_maximum_variance_coarse: 3.0

    # Minimum score for coarse pass to promote to fine matching.
    # ↑ → fewer candidates reach expensive fine pass → faster, stricter.
    loop_match_minimum_response_coarse: 0.55

    # Minimum score for fine pass to actually apply the loop closure.
    # ↑ → only very confident closures modify the pose graph → ↓ jumps.
    # MOST IMPACTFUL loop closure jitter knob.
    # At 0.65 you may miss weak but real closures — lower to 0.55 if so.
    loop_match_minimum_response_fine:   0.65

    # ── Correlation search (pose refinement window) ────────────────────────
    # Width of the 2D search window (metres) used to refine pose against map.
    # ↑ → corrects larger odometry errors, invites false matches and jitter.
    # ↓ → trusts EKF more, less correction range available.
    # With BNO085 + encoders through EKF, 0.3 m is tight and appropriate.
    # Raise to 0.5 m only if odometry regularly drifts more than ~0.3 m.
    correlation_search_space_dimension:      0.3

    # Grid resolution of the correlation search (metres).
    # ↓ → finer search, more accurate result, more CPU.
    # Diminishing returns below 0.01 m for A1M8's beam width.
    correlation_search_space_resolution:     0.01

    # Gaussian blur on the map before correlation scoring.
    # ↑ → smoother cost landscape, tolerates more scan noise.
    # ↓ → sharper cost landscape, more precise match, less forgiving.
    correlation_search_space_smear_deviation: 0.05

    # Loop closure search params — same semantics as correlation above
    # but applied to the global loop closure search, not local refinement.
    # Larger dimension is acceptable here since loop search is infrequent.
    loop_search_space_dimension:             8.0
    loop_search_space_resolution:            0.05
    loop_search_space_smear_deviation:       0.03

    # ── Scan matcher variance penalties ───────────────────────────────────
    # These weight how strongly the EKF odometry prior resists being
    # overridden by a scan match correction.

    # ↑ → translation corrections penalised more → pose stays closer to
    # EKF estimate → ↓ jitter. Raise if X/Y position jumps are the issue.
    distance_variance_penalty:      1.5

    # ↑ → rotation corrections penalised more → yaw stays closer to
    # BNO085 estimate → ↓ yaw jitter. Raise if heading jumps are dominant.
    angle_variance_penalty:         3.0

    # Angular resolution for the fine scan matcher pass (radians).
    # 0.00349 rad ≈ 0.2° — appropriate for A1M8's ~1° beam spacing.
    # ↓ → finer but more CPU; no benefit below beam angular resolution.
    fine_search_angle_offset:       0.00349

    # Angular half-width of the coarse matcher search (radians).
    # ↑ → tolerates larger heading errors before fine pass, more CPU.
    # 0.2 rad ≈ 11.5° — covers most heading drift between nodes.
    coarse_search_angle_offset:     0.2

    # Step size for coarse angular search (radians).
    # ↓ → finer coarse pass, more CPU. 0.02 rad ≈ 1.1°.
    coarse_angle_resolution:        0.02

    # Score floor for the angular component of a match penalty.
    # ↑ → rejects matches requiring large heading corrections more readily.
    minimum_angle_penalty:          0.9

    # Score floor for the translation component of a match penalty.
    # ↑ → rejects matches requiring large position corrections more readily.
    minimum_distance_penalty:       0.5

    # Expand search space if no good match is found.
    # false → failed match keeps current pose (EKF odometry holds).
    # true → attempts recovery but risks sudden jumps.
    # Keep false — your EKF is reliable enough to hold pose during misses.
    use_response_expansion:         false