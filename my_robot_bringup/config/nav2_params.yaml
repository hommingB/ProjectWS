controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 3.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    enable_stamped_cmd_vel: true 

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 40.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.15
      stateful: true

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.5          # max forward speed m/s — tune to your robot
      lookahead_dist: 0.8
      min_lookahead_dist: 0.55
      max_lookahead_dist: 0.90
      lookahead_time: 1.0
      rotate_to_heading_angular_vel: 0.314
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.7
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.2
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.7
      regulated_linear_scaling_min_speed: 0.1
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 1.2
      max_angular_accel: 6.28
      max_robot_pose_search_dist: 10.0

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    robot_base_frame: base_footprint 
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    enable_stamped_cmd_vel: true
    robot_base_frame: base_footprint 
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.7
    min_rotational_vel: 0.3
    rotational_acc_lim: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      transform_tolerance: 1.0
      update_frequency: 7.0
      publish_frequency: 7.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.4          # Enlarge footprint slightly for safety
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          observation_persistence: 0.0 # Moderate decay time for blind spots
          obstacle_min_range: 0.0
      
      # ── ToF crossing-ray layer ────────────────────────────────────────────
      # Reads /tof/left and /tof/right (sensor_msgs/Range, INFRARED).
      # Handles the low-front blind zone that the LiDAR voxel_layer misses.
      #
      # Layer order matters — tof_layer runs AFTER voxel_layer so LiDAR
      # obstacles are already in the costmap when ToF clears free space.
      # inflation_layer always runs last so it inflates everything together.
      # tof_layer:
      #   plugin: nav2_costmap_2d::RangeSensorLayer
      #   enabled: true
 
      #   # Both ToF topics fed into one layer — nav2 fuses them internally
      #   topics: ["/tof/left", "/tof/right"]
 
      #   # CRITICAL for your crossing-ray design: when a sensor reports its
      #   # max_range (nothing detected), that cell is actively cleared.
      #   # Without this, the V-shaped detection zone fills with ghost obstacles.
      #   clear_on_max_reading: true
 
      #   # Must exactly match sensor_msgs/Range values published by imu_tof_node
      #   min_range: 0.03    # metres — VL53L0X blind zone
      #   max_range: 1.20    # metres — practical indoor limit
 
      #   # Bayesian cone model tuning
      #   # phi controls how sharply probability drops off toward cone edges:
      #   #   lower (0.5) = wide soft cone, higher (2.0) = tight hard cone
      #   phi: 1.2
 
      #   # inflate_cone: 1.0 = mark exactly the sensor FOV (27°)
      #   # increase slightly (e.g. 1.1) to widen the marked region
      #   inflate_cone: 1.0
 
      #   # no_readings_timeout: if a sensor goes silent for this many seconds,
      #   # the layer stops trusting it and stops clearing/marking from it.
      #   # Matches your RECONNECT_AFTER logic in imu_tof_node — ~0.5s worst case.
      #   no_readings_timeout: 2.0
 
      #   # ALL = accept both FIXED and VARIABLE radiation type messages.
      #   # Your node publishes INFRARED which is a subtype of VARIABLE.
      #   input_sensor_type: ALL

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.5      # Increased for human safety buffer
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      transform_tolerance: 1.0
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.4           # Enlarge footprint slightly for safety
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer",
                "keepout_filter", "speed_filter", "inflation_layer"]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.0
          observation_persistence: 0.2 # Moderate decay time for blind spots
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.5

      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        filter_info_topic: "/keepout_filter_info"
        mask: "my_vietduc_3b_map_keepout.yaml"

      speed_filter:
        plugin: nav2_costmap_2d::SpeedFilter
        filter_info_topic: "/speed_filter_info"
        mask: "my_vietduc_3b_map_speed.yaml"
        speed_limit: true

      always_send_full_costmap: true

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.6, 0.0, 3.14]      # [vx, vy, vyaw] — match your robot
    min_velocity: [-0.6, 0.0, -3.14]
    max_accel: [0.2, 0.0, 3.14]
    max_decel: [-0.6, 0.0, -3.14]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.1
    enable_stamped_cmd_vel: true

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel_safe
    enable_stamped_cmd_vel: true
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    stop_pub_timeout: 2.0
    enabled: true
    polygons: ["FootprintSlow", "FootprintApproach", "FootprintStop"]

    FootprintSlow:
      type: polygon
      action_type: slowdown
      slowdown_ratio: 0.6
      min_points: 4
      visualize: false
      enabled: true
      points: "[[1.2, 0.40], [1.2, -0.40], [0.30, -0.40], [-0.20, -0.25], [-0.20, 0.25], [0.30, 0.40]]"

    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: local_costmap/published_footprint
      time_before_impact: 1.5
      simulation_time_step: 0.02
      min_points: 10
      visualize: false
      enabled: true

    FootprintStop:
      type: polygon
      action_type: stop
      min_points: 4
      visualize: false
      enabled: true
      points: "[[0.40, 0.20], [0.40, -0.20], [-0.10, -0.18], [-0.10, 0.18]]"

    observation_sources: ["scan"]
    scan:
      type: scan
      topic: /scan_filtered

keepout_costmap_filter_info_server:
  ros__parameters:
    use_sim_time: false
    type: 0
    filter_info_topic: "/keepout_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0

speed_costmap_filter_info_server:
  ros__parameters:
    use_sim_time: false
    type: 1
    filter_info_topic: "/speed_filter_info"
    mask_topic: "/speed_filter_mask"
    base: 0.0
    multiplier: 1.0