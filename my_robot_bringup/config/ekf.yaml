ekf_filter_node:
  ros__parameters:
    frequency: 10.0
    two_d_mode: true
    publish_tf: true
    
    # Frames
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Sensors (format: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az])
    odom0: diff_drive_controller/odom
    odom0_config: [false, false, false,   # position — let EKF integrate
                  false, false, false,   # orientation — IMU handles this
                  true,  false, false,   # vx — wheel odom is reliable
                  false, false, false,    # vyaw — wheel odom is reliable
                  false, false, false]   # acceleration — not from odom
    odom0_differential: false
    odom0_relative: false

    imu0: /imu/data
    imu0_config: [false, false, false,   # position — IMU can't give this
                  true,  true,  true,    # orientation — BNO085 onboard fusion, trust it
                  false, false, false,   # linear velocity — don't integrate accel
                  true,  true,  true,    # angular velocity — reliable from gyro
                  false, false, false]   # acceleration — BNO085 removes gravity but still noisy
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: false  # BNO085 already removed it