mode_manager:
  ros__parameters:

    # Battery thresholds (0.0 – 1.0)
    battery_low_threshold:  0.20   # 20% → schedule RESTING
    battery_full_threshold: 0.95   # 95% → leave CHARGING, resume BACKGROUND

    # Charging dock pose in the map frame
    dock_points:
      - 6.62135
      - 6.5234
      - 1.5708  # radians

    # Background patrol waypoints — flat list of [x, y, yaw] triples (map frame).
    # The robot visits them in order, then loops back to the first.
    # Example: a simple 4-corner patrol of a 6 x 4 metre space.
    patrol_timeout_sec: 2.5
    patrol_points:
      - 4.56487
      - 7.24993
      - 0.0
      - 49.7373
      - 8.30956
      - 3.1459    # ~90 deg
