dock_aligner:
  ros__parameters:
    reverse_speed: 0.1           # m/s – keep low for demo safety
    reverse_duration_sec: 3.0     # time limit
    reverse_distance_m: 0.15    # distance limit (whichever limit is hit first)
    cmd_rate_hz: 10.0
    cmd_vel_topic: docking/cmd_vel
    odom_topic: /odometry/filtered
    simulate_charging_contact: true   # publish /charging_status when reverse finishes
    stop_hold_sec: 0.3
