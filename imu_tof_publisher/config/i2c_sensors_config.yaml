# nav2_params_sensors.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Paste the tof_layer block into your nav2_params.yaml under
# local_costmap → plugins and global_costmap → plugins as needed.
#
# Full costmap structure:
#   local_costmap:
#     local_costmap:
#       ros__parameters:
#         plugins: ["obstacle_layer", "tof_layer", "inflation_layer"]
#         ...  (paste tof_layer block here)
# ─────────────────────────────────────────────────────────────────────────────

local_costmap:
  local_costmap:
    ros__parameters:

      plugins: ["obstacle_layer", "tof_layer", "inflation_layer"]

      # ── LiDAR layer (existing) ──────────────────────────────────────────
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: lidar_link
          data_type: LaserScan
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0

      # ── ToF crossing-ray layer ──────────────────────────────────────────
      tof_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: true

        topics: ["/tof/left", "/tof/right"]

        # When sensor reports max_range (no obstacle) clear that cell.
        # Critical for your design — prevents ghost obstacles in the V-zone.
        clear_on_max_reading: true

        # Probability model for the Range sensor cone
        # (nav2 uses a Bayesian model for infrared cones)
        no_readings_timeout: 2.0   # seconds before layer stops trusting sensor
        phi:           1.2         # sharpness of the probability fall-off at edges
        inflate_cone:  1.0         # multiplier on FOV cone for costmap marking

        # These MUST match what imu_tof_node publishes in sensor_msgs/Range
        min_range:  0.03           # metres
        max_range:  1.20           # metres
        input_sensor_type: ALL     # accepts VARIABLE, FIXED, or ALL

      # ── Inflation ───────────────────────────────────────────────────────
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 3.0
